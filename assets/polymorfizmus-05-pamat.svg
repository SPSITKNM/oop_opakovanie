<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-label="Pamäť: pole ukazovateľov, objekty a tabuľky virtuálnych metód">
  <style>
    :root{ --stroke:#334155; --text:#1e293b; --node:#ffffff; --band:#eef2f7; --accent:#7c3aed; --muted:#64748b; --cls:#f4f1fb; --pub:#15803d; --priv:#b91c1c; --prot:#b45309; --note:#fffbeb; --obj:#eef6ff; }
    @media (prefers-color-scheme: dark){
      :root{ --stroke:#cbd5e1; --text:#e2e8f0; --node:#1e293b; --band:#1e2739; --accent:#a78bfa; --muted:#94a3b8; --cls:#1c1930; --pub:#4ade80; --priv:#f87171; --prot:#fbbf24; --note:#2a2412; --obj:#152238; }
    }
    text{fill:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .cls{fill:var(--cls); stroke:var(--stroke); stroke-width:1.5;}
    .obj{fill:var(--obj); stroke:var(--stroke); stroke-width:1.5;}
    .sep{stroke:var(--stroke); stroke-width:1.2;}
    .name{font-size:13px; font-weight:700; text-anchor:middle;}
    .oname{font-size:12.5px; font-weight:700; text-anchor:middle; text-decoration:underline;}
    .stereo{font-size:10.5px; fill:var(--muted); text-anchor:middle;}
    .mem{font-size:11.5px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre;}
    .tag{font-size:9.5px; fill:var(--muted); text-anchor:end; font-style:italic;}
    .pub{fill:var(--pub); font-weight:700;} .priv{fill:var(--priv); font-weight:700;} .prot{fill:var(--prot); font-weight:700;}
    .lbl{font-size:11px;} .lblc{font-size:11px; text-anchor:middle;}
    .mut{font-size:10.5px; fill:var(--muted);} .mutc{font-size:10.5px; fill:var(--muted); text-anchor:middle;}
    .ttl{font-size:12.5px; font-weight:700; fill:var(--accent);} .ttlc{font-size:12.5px; font-weight:700; fill:var(--accent); text-anchor:middle;}
    .code{font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .okt{fill:var(--pub); font-weight:700;} .badt{fill:var(--priv); font-weight:700;}
    .ok{stroke:var(--pub); stroke-width:1.6; fill:none; marker-end:url(#mok);}
    .bad{stroke:var(--priv); stroke-width:1.6; fill:none; stroke-dasharray:5 4;}
    .edge{stroke:var(--stroke); stroke-width:1.4; fill:none; marker-end:url(#mopen);}
    .dep{stroke:var(--stroke); stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#mopen);}
    .gen{stroke:var(--stroke); stroke-width:1.5; fill:none; marker-end:url(#mtri);}
    .genl{stroke:var(--stroke); stroke-width:1.5; fill:none;}
    .real{stroke:var(--stroke); stroke-width:1.5; fill:none; stroke-dasharray:6 4; marker-end:url(#mtri);}
    .reall{stroke:var(--stroke); stroke-width:1.5; fill:none; stroke-dasharray:6 4;}
    .node{fill:var(--node); stroke:var(--stroke); stroke-width:1.4;}
    .note{fill:var(--note); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3;}
    .hl{fill:var(--accent); opacity:.16;}
    .brk{stroke:var(--muted); stroke-width:1.3; fill:none;}
    .grid{stroke:var(--stroke); stroke-width:1; fill:none;}
    .hdr{fill:var(--band); stroke:var(--stroke); stroke-width:1;}
  </style>
  <defs>
    <marker id="mopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
    <marker id="mtri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="var(--node)" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
    <marker id="mok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pub)"/>
    </marker>
  </defs>

  <text class="ttl" x="30" y="28">STACK</text>
  <text class="ttl" x="300" y="28">HEAP</text>
  <text class="ttl" x="600" y="28">TABUĽKY (jedna na triedu)</text>
  <rect class="node" x="30" y="76" width="150" height="36" rx="6"/>
  <text class="code" x="40" y="99" text-anchor="start">zvierata[0]</text>
  <rect class="obj" x="280" y="50" width="220" height="90" rx="4"/>
  <text class="lblc" x="390" y="66" text-anchor="middle" style="font-weight:700">objekt Pes</text>
  <line class="sep" x1="280" y1="74" x2="500" y2="74"/>
  <rect class="note" style="fill:none" x="292" y="82" width="196" height="22" rx="3"/>
  <text class="mutc" x="390" y="97" text-anchor="middle">skrytý ukazovateľ</text>
  <text class="mutc" x="390" y="124" text-anchor="middle">atribúty objektu</text>
  <path class="ok" d="M180,94 L278,94"/>
  <rect class="cls" x="590" y="60" width="220" height="60" rx="4"/>
  <text class="lblc" x="700" y="78" text-anchor="middle" style="font-weight:700">tabuľka triedy Pes</text>
  <line class="sep" x1="590" y1="84" x2="810" y2="84"/>
  <text class="code" x="700" y="104" text-anchor="middle">zvuk → Pes::zvuk</text>
  <path class="dep" d="M488,93 L588,90"/>
  <rect class="node" x="30" y="206" width="150" height="36" rx="6"/>
  <text class="code" x="40" y="229" text-anchor="start">zvierata[1]</text>
  <rect class="obj" x="280" y="180" width="220" height="90" rx="4"/>
  <text class="lblc" x="390" y="196" text-anchor="middle" style="font-weight:700">objekt Macka</text>
  <line class="sep" x1="280" y1="204" x2="500" y2="204"/>
  <rect class="note" style="fill:none" x="292" y="212" width="196" height="22" rx="3"/>
  <text class="mutc" x="390" y="227" text-anchor="middle">skrytý ukazovateľ</text>
  <text class="mutc" x="390" y="254" text-anchor="middle">atribúty objektu</text>
  <path class="ok" d="M180,224 L278,224"/>
  <rect class="cls" x="590" y="190" width="220" height="60" rx="4"/>
  <text class="lblc" x="700" y="208" text-anchor="middle" style="font-weight:700">tabuľka triedy Macka</text>
  <line class="sep" x1="590" y1="214" x2="810" y2="214"/>
  <text class="code" x="700" y="234" text-anchor="middle">zvuk → Macka::zvuk</text>
  <path class="dep" d="M488,223 L588,220"/>
  <rect class="node" x="30" y="336" width="150" height="36" rx="6"/>
  <text class="code" x="40" y="359" text-anchor="start">zvierata[2]</text>
  <rect class="obj" x="280" y="310" width="220" height="90" rx="4"/>
  <text class="lblc" x="390" y="326" text-anchor="middle" style="font-weight:700">objekt Ryba</text>
  <line class="sep" x1="280" y1="334" x2="500" y2="334"/>
  <rect class="note" style="fill:none" x="292" y="342" width="196" height="22" rx="3"/>
  <text class="mutc" x="390" y="357" text-anchor="middle">skrytý ukazovateľ</text>
  <text class="mutc" x="390" y="384" text-anchor="middle">atribúty objektu</text>
  <path class="ok" d="M180,354 L278,354"/>
  <rect class="cls" x="590" y="320" width="220" height="60" rx="4"/>
  <text class="lblc" x="700" y="338" text-anchor="middle" style="font-weight:700">tabuľka triedy Ryba</text>
  <line class="sep" x1="590" y1="344" x2="810" y2="344"/>
  <text class="code" x="700" y="364" text-anchor="middle">zvuk → Zviera::zvuk</text>
  <path class="dep" d="M488,353 L588,350"/>
  <text class="lbl" x="30" y="442">Papierik (8 B) → objekt na heape → jeho skrytý ukazovateľ → tabuľka triedy → správny kód.</text>
</svg>
