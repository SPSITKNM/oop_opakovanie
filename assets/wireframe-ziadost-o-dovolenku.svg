<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-label="Wireframe — nová žiadosť o dovolenku a zoznam mojich žiadostí">
  <style>
    :root{
      --stroke:#c3ccd8; --text:#1e293b; --node:#ffffff; --band:#eef2f7;
      --field:#f8fafc; --muted:#64748b; --accent:#7c3aed; --rowalt:#f8fafc;
      --ok:#16a34a; --wait:#b45309; --rej:#dc2626;
      --okbg:#ecfdf3; --waitbg:#fef6e7; --rejbg:#fdecec;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --stroke:#3a475a; --text:#e2e8f0; --node:#141b2b; --band:#1e2739;
        --field:#0f1626; --muted:#94a3b8; --accent:#a78bfa; --rowalt:#182135;
        --ok:#4ade80; --wait:#fbbf24; --rej:#f87171;
        --okbg:#12271c; --waitbg:#2a2113; --rejbg:#2c1616;
      }
    }
    text{fill:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .panel{fill:var(--node); stroke:var(--stroke); stroke-width:1.5;}
    .bar{fill:var(--band);}
    .title{font-size:12px; font-weight:700;}
    .lab{font-size:11px; font-weight:600; fill:var(--muted);}
    .field{fill:var(--field); stroke:var(--stroke); stroke-width:1.2;}
    .ph{font-size:11px; fill:var(--muted);}
    .btn{fill:var(--accent);}
    .btnT{font-size:11.5px; font-weight:700; fill:#fff; text-anchor:middle;}
    .note{font-size:10.5px; fill:var(--muted); font-style:italic;}
    .th{font-size:10px; font-weight:700; fill:var(--muted); letter-spacing:.4px;}
    .cell{font-size:11.5px;}
    .rule{stroke:var(--stroke); stroke-width:1.2;}
    .divider{stroke:var(--band); stroke-width:1.5;}
    .badgeT{font-size:10px; font-weight:700; text-anchor:middle;}
    .reason{font-size:10px; fill:var(--wait); font-style:italic;}
    .cap{font-size:10.5px; fill:var(--muted); font-style:italic; text-anchor:middle;}
  </style>

  <!-- ===== Panel 1: Nová žiadosť ===== -->
  <rect class="panel" x="6" y="8" width="372" height="384" rx="10"/>
  <path class="bar" d="M6,18 a10,10 0 0 1 10,-10 h352 a10,10 0 0 1 10,10 v20 h-372 z"/>
  <circle cx="22" cy="23" r="4" fill="#e57373"/><circle cx="36" cy="23" r="4" fill="#ffd54f"/><circle cx="50" cy="23" r="4" fill="#81c784"/>
  <text class="title" x="66" y="27">Dovolenka · Nová žiadosť</text>

  <text class="lab" x="24" y="68">OD</text>
  <rect class="field" x="24" y="76" width="150" height="30" rx="6"/>
  <text class="ph" x="34" y="95">12. 8. 2026</text>
  <text class="lab" x="200" y="68">DO</text>
  <rect class="field" x="200" y="76" width="150" height="30" rx="6"/>
  <text class="ph" x="210" y="95">16. 8. 2026</text>

  <text class="lab" x="24" y="132">DÔVOD</text>
  <rect class="field" x="24" y="140" width="326" height="62" rx="6"/>
  <text class="ph" x="34" y="160">Rodinná dovolenka…</text>

  <rect class="btn" x="24" y="224" width="160" height="38" rx="8"/>
  <text class="btnT" x="104" y="248">Odoslať žiadosť →</text>

  <line class="divider" x1="24" y1="298" x2="354" y2="298"/>
  <text class="note" x="24" y="320">Po odoslaní: stav „Čaká" → notifikácia</text>
  <text class="note" x="24" y="336">vedúcemu na posúdenie (viď BPMN vyššie).</text>

  <!-- ===== Panel 2: Moje žiadosti ===== -->
  <rect class="panel" x="390" y="8" width="384" height="384" rx="10"/>
  <path class="bar" d="M390,18 a10,10 0 0 1 10,-10 h364 a10,10 0 0 1 10,10 v20 h-384 z"/>
  <circle cx="406" cy="23" r="4" fill="#e57373"/><circle cx="420" cy="23" r="4" fill="#ffd54f"/><circle cx="434" cy="23" r="4" fill="#81c784"/>
  <text class="title" x="450" y="27">Dovolenka · Moje žiadosti</text>

  <text class="th" x="406" y="68">ID</text>
  <text class="th" x="452" y="68">OBDOBIE</text>
  <text class="th" x="612" y="68">STAV</text>
  <line class="rule" x1="402" y1="76" x2="762" y2="76"/>

  <rect x="402" y="84" width="360" height="56" fill="var(--rowalt)"/>
  <text class="cell" x="406" y="106">#1042</text>
  <text class="cell" x="452" y="106">12.–16. 8.</text>
  <rect x="612" y="92" width="112" height="22" rx="11" fill="var(--rejbg)" stroke="var(--rej)"/>
  <text class="badgeT" x="668" y="107" fill="var(--rej)">Zamietnutá</text>
  <text class="reason" x="612" y="131" fill="var(--muted)">dôvod: prekrytie s kolegom</text>

  <rect x="402" y="140" width="360" height="44" fill="var(--node)"/>
  <text class="cell" x="406" y="167">#1043</text>
  <text class="cell" x="452" y="167">20.–24. 8.</text>
  <rect x="612" y="153" width="78" height="22" rx="11" fill="var(--waitbg)" stroke="var(--wait)"/>
  <text class="badgeT" x="651" y="168" fill="var(--wait)">Čaká</text>

  <rect x="402" y="184" width="360" height="44" fill="var(--rowalt)"/>
  <text class="cell" x="406" y="211">#1041</text>
  <text class="cell" x="452" y="211">1.–5. 7.</text>
  <rect x="612" y="197" width="100" height="22" rx="11" fill="var(--okbg)" stroke="var(--ok)"/>
  <text class="badgeT" x="662" y="212" fill="var(--ok)">Schválená</text>

  <line class="divider" x1="402" y1="252" x2="762" y2="252"/>
  <text class="note" x="406" y="274">Zamestnanec vidí len svoje žiadosti.</text>
  <text class="note" x="406" y="290">Vedúci ten istý zoznam za celé oddelenie (viď use case).</text>

  <text class="cap" x="390" y="406">Nízkofidelitný wireframe — overuje tok a obsah obrazovky, nie vzhľad.</text>
</svg>
