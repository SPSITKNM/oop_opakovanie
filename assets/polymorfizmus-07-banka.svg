<svg xmlns="http://www.w3.org/2000/svg" width="980" height="404" viewBox="0 0 980 404" role="img" aria-label="Banka s rôznymi druhmi účtov">
  <style>
    :root{ --stroke:#334155; --text:#1e293b; --node:#ffffff; --band:#eef2f7; --accent:#7c3aed; --muted:#64748b; --cls:#f4f1fb; --pub:#15803d; --priv:#b91c1c; --prot:#b45309; --note:#fffbeb; --obj:#eef6ff; }
    @media (prefers-color-scheme: dark){
      :root{ --stroke:#cbd5e1; --text:#e2e8f0; --node:#1e293b; --band:#1e2739; --accent:#a78bfa; --muted:#94a3b8; --cls:#1c1930; --pub:#4ade80; --priv:#f87171; --prot:#fbbf24; --note:#2a2412; --obj:#152238; }
    }
    text{fill:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .cls{fill:var(--cls); stroke:var(--stroke); stroke-width:1.5;}
    .obj{fill:var(--obj); stroke:var(--stroke); stroke-width:1.5;}
    .sep{stroke:var(--stroke); stroke-width:1.2;}
    .name{font-size:13px; font-weight:700; text-anchor:middle;}
    .oname{font-size:12.5px; font-weight:700; text-anchor:middle; text-decoration:underline;}
    .stereo{font-size:10.5px; fill:var(--muted); text-anchor:middle;}
    .mem{font-size:11.5px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre;}
    .tag{font-size:9.5px; fill:var(--muted); text-anchor:end; font-style:italic;}
    .pub{fill:var(--pub); font-weight:700;} .priv{fill:var(--priv); font-weight:700;} .prot{fill:var(--prot); font-weight:700;}
    .lbl{font-size:11px;} .lblc{font-size:11px; text-anchor:middle;}
    .mut{font-size:10.5px; fill:var(--muted);} .mutc{font-size:10.5px; fill:var(--muted); text-anchor:middle;}
    .ttl{font-size:12.5px; font-weight:700; fill:var(--accent);} .ttlc{font-size:12.5px; font-weight:700; fill:var(--accent); text-anchor:middle;}
    .code{font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .okt{fill:var(--pub); font-weight:700;} .badt{fill:var(--priv); font-weight:700;}
    .ok{stroke:var(--pub); stroke-width:1.6; fill:none; marker-end:url(#mok);}
    .bad{stroke:var(--priv); stroke-width:1.6; fill:none; stroke-dasharray:5 4;}
    .edge{stroke:var(--stroke); stroke-width:1.4; fill:none; marker-end:url(#mopen);}
    .dep{stroke:var(--stroke); stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#mopen);}
    .gen{stroke:var(--stroke); stroke-width:1.5; fill:none; marker-end:url(#mtri);}
    .genl{stroke:var(--stroke); stroke-width:1.5; fill:none;}
    .real{stroke:var(--stroke); stroke-width:1.5; fill:none; stroke-dasharray:6 4; marker-end:url(#mtri);}
    .reall{stroke:var(--stroke); stroke-width:1.5; fill:none; stroke-dasharray:6 4;}
    .node{fill:var(--node); stroke:var(--stroke); stroke-width:1.4;}
    .note{fill:var(--note); stroke:var(--muted); stroke-width:1; stroke-dasharray:4 3;}
    .hl{fill:var(--accent); opacity:.16;}
    .brk{stroke:var(--muted); stroke-width:1.3; fill:none;}
    .grid{stroke:var(--stroke); stroke-width:1; fill:none;}
    .hdr{fill:var(--band); stroke:var(--stroke); stroke-width:1;}
  </style>
  <defs>
    <marker id="mopen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
    <marker id="mtri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="var(--node)" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
    <marker id="mok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pub)"/>
    </marker>
  </defs>

  <rect class="cls" x="500" y="20" width="265.3" height="154" rx="4"/>
  <text class="stereo" x="632.65" y="34">«abstract»</text>
  <text class="name" x="632.65" y="54" style="font-style:italic">Ucet</text>
  <line class="sep" x1="500" y1="64" x2="765.3" y2="64"/>
  <text class="mem" x="510" y="82.0"><tspan class="prot">#</tspan> zostatok: int</text>
  <line class="sep" x1="500" y1="92" x2="765.3" y2="92"/>
  <text class="mem" x="510" y="110.0"><tspan class="pub">+</tspan> Ucet(z: int)</text>
  <text class="mem" x="510" y="128.0" style="font-style:italic"><tspan class="pub">+</tspan> moznoVybrat(suma: int): bool</text>
  <text class="tag" x="757.3" y="128.0">= 0</text>
  <text class="mem" x="510" y="146.0"><tspan class="pub">+</tspan> vyber(suma: int): bool</text>
  <text class="mem" x="510" y="164.0"><tspan class="pub">+</tspan> ~Ucet()</text>
  <text class="tag" x="757.3" y="164.0">virtual</text>
  <rect class="cls" x="324.34999999999997" y="234" width="293.3" height="70" rx="4"/>
  <text class="name" x="471.0" y="254">StandartnyUcet</text>
  <line class="sep" x1="324.34999999999997" y1="264" x2="617.65" y2="264"/>
  <line class="sep" x1="324.34999999999997" y1="276" x2="617.65" y2="276"/>
  <text class="mem" x="334.34999999999997" y="294.0"><tspan class="pub">+</tspan> moznoVybrat(suma: int): bool</text>
  <text class="tag" x="609.65" y="294.0">override</text>
  <rect class="cls" x="647.65" y="234" width="293.3" height="86" rx="4"/>
  <text class="name" x="794.3" y="254">UverUcet</text>
  <line class="sep" x1="647.65" y1="264" x2="940.95" y2="264"/>
  <text class="mem" x="657.65" y="282.0"><tspan class="priv">-</tspan> limit: int</text>
  <line class="sep" x1="647.65" y1="292" x2="940.95" y2="292"/>
  <text class="mem" x="657.65" y="310.0"><tspan class="pub">+</tspan> moznoVybrat(suma: int): bool</text>
  <text class="tag" x="932.95" y="310.0">override</text>
  <rect class="cls" x="30" y="40" width="248.4" height="122" rx="4"/>
  <text class="name" x="154.2" y="60">Banka</text>
  <line class="sep" x1="30" y1="70" x2="278.4" y2="70"/>
  <text class="mem" x="40" y="88.0"><tspan class="priv">-</tspan> ucty: vector&lt;Ucet*&gt;</text>
  <line class="sep" x1="30" y1="98" x2="278.4" y2="98"/>
  <text class="mem" x="40" y="116.0"><tspan class="pub">+</tspan> pridajUcet(u: Ucet*): void</text>
  <text class="mem" x="40" y="134.0"><tspan class="pub">+</tspan> spracujVybery(suma: int): void</text>
  <text class="mem" x="40" y="152.0"><tspan class="pub">+</tspan> ~Banka()</text>
  <path class="genl" d="M471.0,234 L471.0,206"/>
  <path class="genl" d="M794.3,234 L794.3,206"/>
  <path class="genl" d="M471.0,206 L794.3,206"/>
  <path class="gen" d="M632.65,206 L632.65,175"/>
  <polygon points="278.4,84 287.4,78 296.4,84 287.4,90" fill="var(--node)" stroke="var(--stroke)" stroke-width="1.4"/>
  <path class="genl" d="M296.4,84 L498,84"/>
  <text class="mut" x="302.4" y="78">ucty</text>
  <text class="mut" x="466" y="78">0..*</text>
  <rect class="note" x="30" y="340" width="780" height="44" rx="3"/>
  <text class="lbl" x="40" y="360">Banka drží ukazovatele na Ucet (vector&lt;Ucet*&gt;), ale v skutočnosti sú v nej StandartnyUcet aj UverUcet.</text>
  <text class="lbl" x="40" y="376">spracujVybery() volá vyber() na každom a každý účet sa rozhodne po svojom (polymorfizmus).</text>
</svg>
