<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" role="img" aria-label="Sekvenčný diagram — podanie a schválenie žiadosti o dovolenku">
  <style>
    :root{ --stroke:#334155; --text:#1e293b; --node:#ffffff; --band:#eef2f7; --accent:#7c3aed; --muted:#64748b; --act:#e9e4f7; --frame:#faf8fd; }
    @media (prefers-color-scheme: dark){
      :root{ --stroke:#cbd5e1; --text:#e2e8f0; --node:#1e293b; --band:#1e2739; --accent:#a78bfa; --muted:#94a3b8; --act:#2b2547; --frame:#181528; }
    }
    text{fill:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .head{fill:var(--band); stroke:var(--stroke); stroke-width:1.4;}
    .life{stroke:var(--stroke); stroke-width:1.2; stroke-dasharray:4 4;}
    .actbar{fill:var(--act); stroke:var(--stroke); stroke-width:1;}
    .sync{stroke:var(--stroke); stroke-width:1.5; fill:none; marker-end:url(#solid);}
    .async{stroke:var(--stroke); stroke-width:1.5; fill:none; marker-end:url(#open);}
    .ret{stroke:var(--stroke); stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#open);}
    .frame{fill:none; stroke:var(--muted); stroke-width:1.2;}
    .frameDiv{stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4;}
    .flbl{font-size:9.5px; font-weight:700; fill:var(--muted);}
    .name{font-size:11.5px; font-weight:700; text-anchor:middle;}
    .msg{font-size:10.5px; text-anchor:middle;}
    .guard{font-size:10px; fill:var(--muted);}
  </style>
  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--stroke)"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line class="life" x1="95" y1="46" x2="95" y2="452"/>
  <line class="life" x1="330" y1="46" x2="330" y2="452"/>
  <line class="life" x1="560" y1="46" x2="560" y2="452"/>

  <!-- activation bars -->
  <rect class="actbar" x="325" y="74" width="10" height="332"/>
  <rect class="actbar" x="555" y="150" width="10" height="46"/>

  <!-- heads -->
  <rect class="head" x="35" y="12" width="120" height="34" rx="4"/><text class="name" x="95" y="33">Zamestnanec</text>
  <rect class="head" x="285" y="12" width="90" height="34" rx="4"/><text class="name" x="330" y="33">Systém</text>
  <rect class="head" x="510" y="12" width="100" height="34" rx="4"/><text class="name" x="560" y="33">Vedúci</text>

  <!-- 1: podaj -->
  <path class="sync" d="M95,78 L323,78"/>
  <text class="msg" x="205" y="72">podajŽiadosť(od, do, dôvod)</text>

  <!-- 2: return id -->
  <path class="ret" d="M325,112 L97,112"/>
  <text class="msg" x="205" y="106">id žiadosti</text>

  <!-- 3: notifikácia vedúcemu (async) -->
  <path class="async" d="M335,150 L555,150"/>
  <text class="msg" x="445" y="144">notifikácia: nová žiadosť</text>

  <!-- 4: rozhodni (sync) -->
  <path class="sync" d="M555,190 L337,190"/>
  <text class="msg" x="446" y="184">rozhodni(výsledok)</text>

  <!-- alt frame -->
  <rect class="frame" x="55" y="222" width="520" height="196"/>
  <path class="frame" d="M55,222 h44 v14 l-8,8 h-36 z" fill="var(--frame)"/>
  <text class="flbl" x="66" y="236">alt</text>

  <text class="guard" x="70" y="256">[výsledok = schválené]</text>
  <path class="async" d="M335,278 L97,278"/>
  <text class="msg" x="210" y="272">notifikácia: schválené</text>

  <line class="frameDiv" x1="55" y1="316" x2="575" y2="316"/>

  <text class="guard" x="70" y="336">[výsledok = zamietnuté]</text>
  <path class="async" d="M335,362 L97,362"/>
  <text class="msg" x="210" y="356">notifikácia: zamietnuté + dôvod</text>
  <path class="async" d="M335,392 L97,392"/>
  <text class="msg" x="210" y="386">(proces končí)</text>
</svg>
