<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Use case diagram — systém dovoleniek">
  <style>
    :root{ --stroke:#334155; --text:#1e293b; --node:#ffffff; --accent:#7c3aed; --muted:#64748b; --uc:#f4f1fb; }
    @media (prefers-color-scheme: dark){
      :root{ --stroke:#cbd5e1; --text:#e2e8f0; --node:#141b2b; --accent:#a78bfa; --muted:#94a3b8; --uc:#1c1930; }
    }
    text{fill:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .fig{stroke:var(--stroke); stroke-width:1.6; fill:none;}
    .assoc{stroke:var(--stroke); stroke-width:1.4; fill:none;}
    .dep{stroke:var(--stroke); stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#oa);}
    .uc{fill:var(--uc); stroke:var(--stroke); stroke-width:1.4;}
    .bnd{fill:none; stroke:var(--stroke); stroke-width:1.4;}
    .lbl{font-size:11.5px; text-anchor:middle;}
    .act{font-size:11px; text-anchor:middle; fill:var(--muted);}
    .ster{font-size:9.5px; fill:var(--muted); text-anchor:middle;}
    .bl{font-size:10px; fill:var(--muted); letter-spacing:.4px;}
  </style>
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--stroke)" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect class="bnd" x="140" y="24" width="440" height="332" rx="4"/>
  <text class="bl" x="150" y="42">SYSTÉM DOVOLENIEK</text>

  <g class="fig" transform="translate(40,70)">
    <circle cx="14" cy="8" r="8"/><path d="M14,16 V40 M2,26 H26 M14,40 L4,58 M14,40 L24,58"/>
  </g>
  <text class="act" x="54" y="148">Zamestnanec</text>

  <g class="fig" transform="translate(40,236)">
    <circle cx="14" cy="8" r="8"/><path d="M14,16 V40 M2,26 H26 M14,40 L4,58 M14,40 L24,58"/>
  </g>
  <text class="act" x="54" y="314">Vedúci</text>

  <g class="fig" transform="translate(650,196)">
    <circle cx="14" cy="8" r="8"/><path d="M14,16 V40 M2,26 H26 M14,40 L4,58 M14,40 L24,58"/>
  </g>
  <text class="act" x="664" y="270">Systém (SLA)</text>

  <ellipse class="uc" cx="248" cy="84" rx="74" ry="24"/>
  <text class="lbl" x="248" y="88">Podať žiadosť</text>

  <ellipse class="uc" cx="452" cy="84" rx="86" ry="24"/>
  <text class="lbl" x="452" y="88">Skontrolovať zostatok</text>

  <ellipse class="uc" cx="248" cy="188" rx="74" ry="24"/>
  <text class="lbl" x="248" y="192">Posúdiť žiadosť</text>

  <ellipse class="uc" cx="240" cy="300" rx="68" ry="24"/>
  <text class="lbl" x="240" y="304">Sledovať stav</text>

  <ellipse class="uc" cx="472" cy="258" rx="86" ry="24"/>
  <text class="lbl" x="472" y="262">Eskalovať pri nečinnosti</text>

  <path class="assoc" d="M64,96 L176,86"/>
  <path class="assoc" d="M64,120 L176,292"/>
  <path class="assoc" d="M64,258 L176,190"/>
  <path class="assoc" d="M64,284 L174,300"/>
  <path class="assoc" d="M650,224 L556,256"/>

  <path class="dep" d="M322,84 L364,84"/>
  <text class="ster" x="343" y="76">«include»</text>

  <path class="dep" d="M410,238 L312,206"/>
  <text class="ster" x="356" y="214">«extend»</text>
</svg>
